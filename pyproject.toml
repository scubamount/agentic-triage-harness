[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-triage-harness"
version = "0.1.0"
description = "Constraint-satisfaction harness for agentic debugging and triage: prompts, case schema, matrix and intervention-ledger tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "scubamount"}]
keywords = ["triage", "debugging", "agents", "code-review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
